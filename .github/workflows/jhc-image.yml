---
# semantic-release on jhc/main (config: .releaserc.json), then publishes
# ghcr.io/jhofer-cloud/seerr:<version> for each new release.
name: jhc release

on:
  push:
    branches:
      - jhc/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jhc-release

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      # Installed outside the repo so the plugins resolve the preset as a sibling
      - name: Install semantic-release
        run: >-
          npm install --no-save --prefix "$RUNNER_TEMP/semantic-release"
          semantic-release@25.0.9
          @semantic-release/commit-analyzer@13.0.1
          @semantic-release/release-notes-generator@14.1.1
          @semantic-release/github@12.0.10
          conventional-changelog-conventionalcommits@9.3.1

      # package.json's repository points at upstream, so name the fork explicitly
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          "$RUNNER_TEMP/semantic-release/node_modules/.bin/semantic-release"
          --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

      # semantic-release tags HEAD locally when it releases
      - name: Released version
        id: version
        run: |
          tag=$(git tag --points-at HEAD --list 'seerr-v*' | head -1)
          echo "version=${tag#seerr-v}" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: seerr-v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/seerr
          tags: type=raw,value=${{ needs.release.outputs.version }}
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}

      # amd64 only: Seerr runs on the amd64 workers, arm64 is control plane only
      - name: Build & push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=${{ needs.release.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.ts.outputs.TIMESTAMP }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=jhc-amd64
          cache-to: type=gha,mode=max,scope=jhc-amd64
          provenance: false
