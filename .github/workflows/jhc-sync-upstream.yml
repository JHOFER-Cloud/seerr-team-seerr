---
# Merges upstream develop into the jhc/main patch branch via an auto-merging
# PR. Runs from the default branch, so jhc/main must be the default branch.
name: Sync jhc with upstream

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jhc-sync-upstream

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      BASE_BRANCH: jhc/main
      SYNC_BRANCH: jhc/sync-upstream
    steps:
      # App token: pushes and PRs made with GITHUB_TOKEN do not trigger CI
      - name: Generate GitHub App token
        id: token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_PRIV_KEY }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Check for upstream changes
        id: check
        run: |
          git remote add upstream https://github.com/seerr-team/seerr.git
          git fetch upstream develop
          if git merge-base --is-ancestor upstream/develop HEAD; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$(git rev-parse --short upstream/develop)" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.check.outputs.has_updates == 'true'
        run: git push --force origin "refs/remotes/upstream/develop:refs/heads/$SYNC_BRANCH"

      - name: Create or update PR
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
        run: |
          body="Merges upstream develop at \`$UPSTREAM_SHA\` into \`$BASE_BRANCH\`."
          pr=$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
              --title "chore: sync upstream develop" --body "$body" \
              --reviewer ojsef39
          fi
          # Merge commit keeps the patch history; waits for required checks
          gh pr merge "$SYNC_BRANCH" --auto --merge
